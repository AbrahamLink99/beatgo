name: beatgo
description: Build house loops on your phone, export MIDI into Ableton.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^3.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
