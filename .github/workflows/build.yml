name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the android/ scaffold (and anything else missing) without
      # touching files that already exist in the repo.
      - name: Scaffold platform files
        run: |
          flutter create . --org se.beatgo --project-name beatgo --platforms android
          rm -f test/widget_test.dart

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk beatgo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: beatgo-arm64
          path: beatgo.apk
          if-no-files-found: error

      # Always-current download link: github.com/<owner>/beatgo/releases/latest
      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest beatgo.apk \
            --title "BeatGo build ${{ github.run_number }} ($SHORT)" \
            --notes "Bygge ${{ github.run_number }} från main ($SHORT). Ladda ner beatgo.apk och installera. Numret visas uppe till höger i appen."
